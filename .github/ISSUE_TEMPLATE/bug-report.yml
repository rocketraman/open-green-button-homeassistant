name: Bug Report
description: Something isn't working
labels: []
body:
  - type: markdown
    attributes:
      value: |
        **Please update to the latest release before filing** — the bug you're hitting may
        already be fixed.

        ⚠️ **If HACS shows you a commit id (like `3730b11`) instead of a version number**, you
        installed before this project had tagged releases, and HACS will never offer you an
        update — it compares the commit id against the release number and can conclude you're
        already ahead. Use **HACS → Open Green Button → ⋮ → Redownload** and pick the newest
        version. You only need to do this once.

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: |
        **The single most useful thing you can attach.** Settings → Devices & Services →
        **Open Green Button** → ⋮ → **Download Diagnostics**, then drag the file in here.

        It records the integration version, your utility, and the state of the poll
        automatically — which saves a round trip of questions. Note that with debug logging
        enabled the download also contains your raw utility feed, so look it over first if
        you'd rather not post it.

        Skip this only if setup fails so early that no integration entry exists.

  - type: input
    id: version
    attributes:
      label: Installed version
      description: |
        The version HACS shows for this integration, e.g. `0.2.0`. Found under
        HACS → search for **Open Green Button** → open it.

        If you're attaching diagnostics you can leave this blank — it's in there.
      placeholder: 0.2.0

  - type: dropdown
    id: updated
    attributes:
      label: Did you re-check on the latest release?
      options:
        - "Yes — I'm on the newest version and the problem is still there"
        - "No"
    validations:
      required: true

  - type: input
    id: utility
    attributes:
      label: Utility
      placeholder: Consumers Energy
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Settings → System → Logs, filtered to `custom_components.greenbutton`.

        For anything involving missing or delayed data, please turn on debug logging first
        (Settings → Devices & Services → Open Green Button → **Enable debug logging**), let it
        run through at least one poll, then copy the log. The debug output records what each
        poll asked the utility for and what came back, which is usually what settles the
        question. Redact account numbers and usage point ids if you'd rather not post them.
      render: text

  - type: textarea
    id: extra
    attributes:
      label: Anything else
